[pytest]
# Default CI run: unit tests only. Integration / e2e / live / slow / ASR / network
# tests are excluded and run manually or in dedicated jobs.
addopts = -m "not integration and not e2e and not live and not slow and not requires_asr and not requires_public_network"
testpaths = core service/tests tests
pythonpath = src
markers =
    unit: fast, isolated, in-memory tests (default CI)
    integration: requires a running FVSC service / external process
    e2e: end-to-end flows (vault, voice, benchmarks)
    live: hits live external services / real network (manual only)
    slow: long-running (>~30s), excluded from default CI
    requires_asr: needs a local ASR / LLM model (e.g. faster-whisper, Ollama) (manual)
    requires_public_network: fetches public corpora / Stack Exchange API (manual)
