name: public-natural-language-live

on:
  workflow_dispatch:
    inputs:
      site:
        description: Stack Exchange API site parameter
        required: true
        default: workplace
      from_date:
        description: Inclusive YYYY-MM-DD start
        required: true
        default: "2025-01-01"
      to_date:
        description: Inclusive YYYY-MM-DD end
        required: true
        default: "2025-12-31"
      pages:
        description: Chronological question pages, 1-20
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  public-language:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: ${{ inputs.site }}
      FROM_DATE: ${{ inputs.from_date }}
      TO_DATE: ${{ inputs.to_date }}
      PAGES: ${{ inputs.pages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Fetch frozen attributed corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-language
          python -m core.natural_language_benchmark fetch-stackexchange \
            --site "$SITE" \
            --from-date "$FROM_DATE" \
            --to-date "$TO_DATE" \
            --pages "$PAGES" \
            --page-size 100 \
            --minimum-score 1 \
            --output "artifacts/public-language/${SITE}-${FROM_DATE}-${TO_DATE}.jsonl" \
            | tee artifacts/public-language/fetch-summary.json
      - name: Run semantic representation bakeoff
        shell: bash
        run: |
          set -euo pipefail
          python -m core.representation_bakeoff \
            --input "artifacts/public-language/${SITE}-${FROM_DATE}-${TO_DATE}.jsonl" \
            --output "artifacts/public-language/${SITE}-${FROM_DATE}-${TO_DATE}-representation-bakeoff.json" \
            --train-fraction 0.8 \
            --bootstrap-samples 2000 \
            | tee artifacts/public-language/representation-bakeoff-summary.json
      - name: Write job summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/public-language')
          fetch_summaries = list(root.glob('fetch-summary.json'))
          bakeoffs = list(root.glob('*-representation-bakeoff.json'))
          if len(fetch_summaries) != 1 or len(bakeoffs) != 1:
              raise SystemExit(
                  f'expected one fetch summary and one bakeoff, found {len(fetch_summaries)} / {len(bakeoffs)}'
              )
          bakeoff = json.loads(bakeoffs[0].read_text())
          parser = bakeoff['parser_diagnostics']
          comparison = bakeoff['evaluation']
          rows = [
              '# FVSC public-language representation bakeoff',
              '',
              f"- Corpus SHA-256: `{bakeoff['corpus_sha256']}`",
              f"- Records / threads: {bakeoff['records']} / {bakeoff['threads']}",
              f"- Parseable threads: {parser['parseable_threads']}",
              f"- Train / test documents: {comparison['train_documents']} / {comparison['test_documents']}",
              f"- Known-positive coverage: {comparison['known_positive_coverage']:.4f}",
              f"- Verdict: `{comparison['verdict']}`",
              '',
              '| Model | AUC | Average precision | Pairwise comparisons |',
              '|---|---:|---:|---:|',
          ]
          for name, metrics in comparison['models'].items():
              rows.append(
                  f"| {name} | {metrics['auc']:.4f} | {metrics['average_precision']:.4f} | {metrics['pairwise_comparisons']} |"
              )
          rows.extend([
              '',
              f"Best non-density backend: `{comparison['best_non_density_backend']}`",
              f"Density AUC delta: {comparison['density_auc_delta_vs_best_backend']:.6f}",
              f"Paired document bootstrap CI95: {comparison['paired_document_bootstrap_ci95']}",
              '',
              '> This benchmark tests directed relation ranking. It does not test the density-matrix advantage hypothesis for contextual polysemy.',
          ])
          (root / 'representation-bakeoff-summary.md').write_text(
              '\n'.join(rows) + '\n', encoding='utf-8'
          )
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as handle:
              handle.write('\n'.join(rows) + '\n')
          PY
      - name: Upload attributed corpus and aggregate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fvsc-public-language-${{ env.SITE }}-${{ env.FROM_DATE }}-${{ env.TO_DATE }}
          path: artifacts/public-language/
          if-no-files-found: error
