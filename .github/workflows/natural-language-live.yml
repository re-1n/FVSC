name: public-natural-language-live

on:
  pull_request:
    paths:
      - ".github/workflows/natural-language-live.yml"
      - "core/container_core.py"
      - "core/container_benchmark.py"
      - "tests/test_container_core.py"
      - "tests/test_container_benchmark.py"
  workflow_dispatch:
    inputs:
      site:
        description: Stack Exchange API site parameter
        required: true
        default: workplace
      from_date:
        description: Inclusive YYYY-MM-DD start
        required: true
        default: "2025-01-01"
      to_date:
        description: Inclusive YYYY-MM-DD end
        required: true
        default: "2025-12-31"
      pages:
        description: Chronological question pages, 1-20
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  public-language:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE: ${{ inputs.site || 'workplace' }}
      FROM_DATE: ${{ inputs.from_date || '2025-01-01' }}
      TO_DATE: ${{ inputs.to_date || '2025-12-31' }}
      PAGES: ${{ inputs.pages || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Fetch frozen attributed corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-language
          python -m core.natural_language_benchmark fetch-stackexchange \
            --site "$SITE" \
            --from-date "$FROM_DATE" \
            --to-date "$TO_DATE" \
            --pages "$PAGES" \
            --page-size 100 \
            --minimum-score 1 \
            --output "artifacts/public-language/${SITE}-${FROM_DATE}-${TO_DATE}.jsonl" \
            | tee artifacts/public-language/fetch-summary.json
      - name: Run explicit container bakeoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee artifacts/public-language/container-bakeoff-summary.json
          import hashlib
          import json
          import os
          from pathlib import Path

          from core.container_benchmark import BENCHMARK_VERSION, run_container_bakeoff
          from core.natural_language_benchmark import _thread_documents, load_corpus

          root = Path("artifacts/public-language")
          corpus_files = list(root.glob("*.jsonl"))
          if len(corpus_files) != 1:
              raise SystemExit(f"expected one corpus, found {len(corpus_files)}")
          corpus_path = corpus_files[0]
          records = load_corpus(corpus_path)
          documents, parser_diagnostics = _thread_documents(records, max_threads=None)
          evaluation = run_container_bakeoff(
              documents,
              train_fraction=0.8,
              bootstrap_samples=2000,
              max_positives_per_document=20,
              max_negatives_per_document=20,
          )
          report = {
              "benchmark": BENCHMARK_VERSION,
              "corpus_sha256": hashlib.sha256(corpus_path.read_bytes()).hexdigest(),
              "records": len(records),
              "threads": len({(record.site, record.thread_id) for record in records}),
              "parser_diagnostics": parser_diagnostics,
              "evaluation": evaluation,
              "sampling": {
                  "positive_pairs_per_document": 20,
                  "negative_pairs_per_document": 20,
                  "deterministic": True,
              },
              "raw_text_in_report": False,
          }
          output = root / f"{os.environ['SITE']}-{os.environ['FROM_DATE']}-{os.environ['TO_DATE']}-container-bakeoff.json"
          output.write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2, allow_nan=False),
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2))
          PY
      - name: Write job summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/public-language')
          reports = list(root.glob('*-container-bakeoff.json'))
          if len(reports) != 1:
              raise SystemExit(f'expected one container report, found {len(reports)}')
          report = json.loads(reports[0].read_text())
          parser = report['parser_diagnostics']
          comparison = report['evaluation']
          rows = [
              '# FVSC explicit-container live bakeoff',
              '',
              f"- Corpus SHA-256: `{report['corpus_sha256']}`",
              f"- Records / threads: {report['records']} / {report['threads']}",
              f"- Parseable threads: {parser['parseable_threads']}",
              f"- Train / test documents: {comparison['train_documents']} / {comparison['test_documents']}",
              f"- Known-positive coverage: {comparison['known_positive_coverage']:.4f}",
              f"- Sampled positives / negatives: {comparison['sampled_positive_pairs']} / {comparison['negative_pairs']}",
              f"- Verdict: `{comparison['verdict']}`",
              '',
              '| Model | AUC | Average precision | Pairwise comparisons |',
              '|---|---:|---:|---:|',
          ]
          for name, metrics in comparison['models'].items():
              rows.append(
                  f"| {name} | {metrics['auc']:.4f} | {metrics['average_precision']:.4f} | {metrics['pairwise_comparisons']} |"
              )
          rows.extend([
              '',
              f"Best container backend: `{comparison['best_container_backend']}`",
              f"Best non-container backend: `{comparison['best_non_container_backend']}`",
              f"Container AUC delta: {comparison['container_auc_delta_vs_best_non_container']:.6f}",
              f"Paired document bootstrap CI95: {comparison['paired_document_bootstrap_ci95']}",
              f"Asymmetric positive-pair rate: {comparison['asymmetric_positive_pair_rate']:.4f}",
              '',
              '> This is a preliminary deterministic sample. Parser-derived edges remain proxy labels.',
          ])
          (root / 'container-bakeoff-summary.md').write_text(
              '\n'.join(rows) + '\n', encoding='utf-8'
          )
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as handle:
              handle.write('\n'.join(rows) + '\n')
          PY
      - name: Upload attributed corpus and aggregate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fvsc-public-language-${{ env.SITE }}-${{ env.FROM_DATE }}-${{ env.TO_DATE }}
          path: artifacts/public-language/
          if-no-files-found: error
