name: public-natural-language-live

on:
  workflow_dispatch:
    inputs:
      site:
        description: Stack Exchange API site parameter
        required: true
        default: workplace
      from_date:
        description: Inclusive YYYY-MM-DD start
        required: true
        default: "2025-01-01"
      to_date:
        description: Inclusive YYYY-MM-DD end
        required: true
        default: "2025-12-31"
      pages:
        description: Chronological question pages, 1-20
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  public-language:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Fetch frozen attributed corpus
        shell: bash
        env:
          SITE: ${{ inputs.site }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
          PAGES: ${{ inputs.pages }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/public-language
          python -m core.natural_language_benchmark fetch-stackexchange \
            --site "$SITE" \
            --from-date "$FROM_DATE" \
            --to-date "$TO_DATE" \
            --pages "$PAGES" \
            --page-size 100 \
            --minimum-score 1 \
            --output "artifacts/public-language/${SITE}-${FROM_DATE}-${TO_DATE}.jsonl" \
            | tee artifacts/public-language/fetch-summary.json
      - name: Evaluate frozen corpus
        shell: bash
        env:
          SITE: ${{ inputs.site }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        run: |
          set -euo pipefail
          python -m core.natural_language_benchmark evaluate \
            --input "artifacts/public-language/${SITE}-${FROM_DATE}-${TO_DATE}.jsonl" \
            --output "artifacts/public-language/${SITE}-${FROM_DATE}-${TO_DATE}-report.json" \
            --train-fraction 0.8 \
            --bootstrap-samples 2000 \
            | tee artifacts/public-language/evaluation-summary.json
      - name: Write job summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports = list(Path('artifacts/public-language').glob('*-report.json'))
          if len(reports) != 1:
              raise SystemExit(f'expected one report, found {len(reports)}')
          report = json.loads(reports[0].read_text())
          corpus = report['corpus']
          parser = report['parser_diagnostics']
          evaluation = report['evaluation']
          rows = [
              '# FVSC public-language live benchmark',
              '',
              f"- Corpus SHA-256: `{corpus['sha256']}`",
              f"- Records / threads: {corpus['records']} / {corpus['threads']}",
              f"- Parseable threads: {parser['parseable_threads']}",
              f"- Train / test documents: {evaluation['train_documents']} / {evaluation['test_documents']}",
              f"- Known-positive coverage: {evaluation['known_positive_coverage']:.4f}",
              f"- Verdict: `{evaluation['verdict']}`",
              '',
              '| Model | AUC | Average precision | Pairwise comparisons |',
              '|---|---:|---:|---:|',
          ]
          for name, metrics in evaluation['models'].items():
              rows.append(
                  f"| {name} | {metrics['auc']:.4f} | {metrics['average_precision']:.4f} | {metrics['pairwise_comparisons']} |"
              )
          rows.extend([
              '',
              f"Best baseline: `{evaluation['best_baseline']}`",
              f"FVSC AUC delta: {evaluation['fvsc_auc_delta_vs_best_baseline']:.4f}",
              f"Paired bootstrap CI95: {evaluation['paired_bootstrap_ci95']}",
              '',
              '> Parser-derived edges are proxy labels. This run is not evidence of personal usefulness and requires a blinded relation audit.',
          ])
          Path('artifacts/public-language/summary.md').write_text('\n'.join(rows) + '\n', encoding='utf-8')
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as handle:
              handle.write('\n'.join(rows) + '\n')
          PY
      - name: Upload attributed corpus and aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fvsc-public-language-${{ inputs.site }}-${{ inputs.from_date }}-${{ inputs.to_date }}
          path: artifacts/public-language/
          if-no-files-found: error
