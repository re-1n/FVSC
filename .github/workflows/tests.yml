name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run controlled viability benchmark
        run: python -m core.viability_benchmark --output artifacts/viability-report.json
      - name: Upload viability report
        uses: actions/upload-artifact@v4
        with:
          name: fvsc-viability-report
          path: artifacts/viability-report.json
          if-no-files-found: error

  obsidian-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: obsidian-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install plugin dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck plugin
        run: npx tsc --noEmit
      - name: Build plugin
        run: npm run build
