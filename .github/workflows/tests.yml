name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Legacy boundary check
        run: python scripts/check_no_legacy_imports.py
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/pytest.xml 2>&1 | tee artifacts/pytest.log
      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fvsc-unit-test-diagnostics
          path: |
            artifacts/pytest.log
            artifacts/pytest.xml
          if-no-files-found: warn

  obsidian-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # package-lock.json is currently gitignored, so use `npm install` (not `npm ci`).
      # Tracking the lockfile + restoring a `typecheck` job is a follow-up.
      - name: Install plugin dependencies
        working-directory: obsidian-plugin
        run: npm install --no-audit --no-fund
      - name: Build plugin
        working-directory: obsidian-plugin
        run: |
          npm run build
          test -s main.js
      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: fvsc-obsidian-plugin
          path: |
            obsidian-plugin/main.js
            obsidian-plugin/manifest.json
            obsidian-plugin/styles.css
          if-no-files-found: error
