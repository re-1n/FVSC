<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>FVSC — __TITLE__</title>
<script src="https://unpkg.com/cytoscape@3.30.0/dist/cytoscape.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  background: #1a1a1d; color: #cfcfcf;
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  display: flex;
}

/* ───── graph pane ───── */
#graph {
  flex: 1; position: relative; min-width: 0;
}
#network { width: 100%; height: 100%; }
#header {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 12px 18px;
  background: linear-gradient(180deg, #1a1a1dee, transparent);
  z-index: 10; pointer-events: none;
}
#header h1 { font-size: 14px; font-weight: 500; color: #888; }
#header h1 b { color: #ddd; }
#header .meta { font-size: 11px; color: #555; margin-top: 4px; }

/* ───── chat pane ───── */
#chat {
  width: 440px; background: #131316;
  border-left: 1px solid #25252a;
  display: flex; flex-direction: column;
}
#chat-header {
  padding: 14px 18px; border-bottom: 1px solid #1f1f24;
  font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: 1.5px;
  display: flex; justify-content: space-between; align-items: center;
}
#chat-header .model { font-family: 'Consolas', monospace; color: #4a8; text-transform: none; letter-spacing: 0; }

#log { flex: 1; overflow-y: auto; padding: 16px; }
.msg {
  padding: 10px 14px; margin-bottom: 12px; border-radius: 4px;
  font-size: 13px; line-height: 1.55; word-wrap: break-word;
  white-space: pre-wrap;
}
.msg.user {
  background: #1b1d24; border-left: 2px solid #4a6c8a;
  color: #d8d8d8;
}
.msg.bot {
  background: #18181c; border-left: 2px solid #4a8;
  color: #cfcfcf;
}
.msg.error {
  background: #2a1818; border-left: 2px solid #a55;
  color: #d8a8a8;
}
.msg .mk {
  background: #2a3a55; color: #bdd; padding: 1px 4px; border-radius: 2px;
  font-family: 'Consolas', monospace; font-size: 12px;
  cursor: pointer;
}
.msg .mk:hover { background: #3a5a85; color: #fff; }
.msg .mk-edge { background: #553a2a; color: #dcb; }
.msg .mk-edge:hover { background: #85583a; color: #fff; }
.msg .mk-word { background: #2a4a2a; color: #beb; }
.msg .mk-judgment { background: #4a2a4a; color: #ebd; }
.msg .mk-note { background: #4a4a2a; color: #eeb; text-decoration: none; }
.msg .mk-note::before { content: "📄 "; font-size: 11px; opacity: 0.7; }
.msg .mk-note:hover { background: #6a6a3a; color: #fff; }

#composer {
  padding: 12px; border-top: 1px solid #1f1f24;
  display: flex; gap: 8px;
}
#input {
  flex: 1; padding: 10px 12px; background: #1c1c22; color: #e0e0e0;
  border: 1px solid #2a2a32; border-radius: 4px;
  font-family: inherit; font-size: 13px;
  resize: none; min-height: 40px; max-height: 120px;
}
#input:focus { outline: none; border-color: #4a8; }
#send {
  padding: 0 18px; background: #2a4a3a; color: #cfe;
  border: 1px solid #3a6a4a; border-radius: 4px;
  font-size: 13px; cursor: pointer;
}
#send:hover:not(:disabled) { background: #3a6a4a; }
#send:disabled { opacity: 0.4; cursor: not-allowed; }

.placeholder {
  color: #555; font-size: 12px; padding: 30px 10px; text-align: center;
  line-height: 1.6;
}
.placeholder code {
  background: #1c1c22; padding: 1px 5px; border-radius: 2px;
  font-family: 'Consolas', monospace; color: #888;
}

/* ───── sources drill-down panel ───── */
#sources-panel {
  background: #1a1d24;
  border-bottom: 1px solid #2a2d36;
  padding: 0;
  max-height: 40%;
  overflow-y: auto;
  flex-shrink: 0;
}
#sources-panel .sources-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  background: #1f2228;
  border-bottom: 1px solid #2a2d36;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #888;
}
#sources-panel .sources-title { color: #cfd0d8; text-transform: none; letter-spacing: 0; font-size: 13px; }
#sources-panel .sources-close {
  background: transparent; border: none; color: #888;
  font-size: 18px; cursor: pointer; padding: 0 4px;
}
#sources-panel .sources-close:hover { color: #fff; }
#sources-panel .sources-list { padding: 6px 0; }
#sources-panel .src-row {
  display: grid; grid-template-columns: 60px 1fr 40px;
  align-items: center; gap: 8px;
  padding: 6px 14px;
  text-decoration: none; color: #cfd0d8;
  font-size: 12px;
  border-left: 2px solid transparent;
  transition: background 120ms;
}
#sources-panel .src-row:hover {
  background: #22262e;
  border-left-color: #4a8;
}
#sources-panel .src-rank {
  position: relative; height: 8px; background: #14161b; border-radius: 2px; overflow: hidden;
}
#sources-panel .src-bar {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, #4a8, #6ac);
  border-radius: 2px;
}
#sources-panel .src-path {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: #cfd0d8;
}
#sources-panel .src-weight {
  text-align: right;
  font-family: 'Consolas', monospace; color: #888; font-size: 11px;
}
#sources-panel .sources-loading,
#sources-panel .sources-err {
  padding: 14px; color: #888; font-size: 12px; line-height: 1.5;
}
#sources-panel .sources-err { color: #b88; }
#sources-panel .src-silent-badge {
  display: inline-block;
  margin-left: 8px;
  padding: 1px 6px;
  background: #2a2433;
  border-radius: 3px;
  color: #b8a8d8;
  font-size: 11px;
  font-family: 'Consolas', monospace;
}
</style>
</head>
<body>

<div id="graph">
  <div id="header">
    <h1><b>__TITLE__</b></h1>
    <div class="meta">__SUBTITLE__</div>
  </div>
  <div id="network"></div>
</div>

<div id="chat">
  <div id="chat-header">
    <span>Антураж</span>
    <span class="model">__MODEL__</span>
  </div>
  <div id="log">
    <div class="placeholder">
      Спрашивай о карте — например «опиши главные кластеры», «какие концепты выглядят необычно».<br><br>
      Когда я упоминаю элементы карты, я оборачиваю их в маркеры <code>[[concept:...]]</code> — они подсвечиваются в графе синхронно.
    </div>
  </div>
  <div id="composer">
    <textarea id="input" placeholder="Спросить о карте..."></textarea>
    <button id="send">→</button>
  </div>
</div>

<script>
const DATA = __GRAPH_DATA__;
const VAULT_NAME = "__VAULT_NAME__";

// ───── nodes & graph (cytoscape.js, Obsidian-style) ─────
// Convert vis-style DATA to cytoscape elements.
const maxWeight = Math.max(1, ...DATA.nodes.map(n => n._weight || n.value || 1));

const elements = [];
DATA.nodes.forEach(n => {
  const w = n._weight || n.value || 1;
  const size = 8 + 28 * Math.pow(w / maxWeight, 0.7);   // size by weight
  elements.push({
    group: 'nodes',
    data: {
      id: n.id,
      label: n.label || n.id,
      color: typeof n.color === 'string' ? n.color : '#6a7ab6',
      size,
      weight: w,
      poly: n._poly || 0,
      facets: n._facets || 0,
      tip: n.title || '',
    },
  });
});

const edgeIdByPair = {};
DATA.edges.forEach((e, idx) => {
  const id = `e${idx}`;
  edgeIdByPair[`${e.from}|${e.to}`] = id;
  elements.push({
    group: 'edges',
    data: { id, source: e.from, target: e.to, weight: e.value || 0.5, tip: e.title || '' },
  });
});

const cy = cytoscape({
  container: document.getElementById('network'),
  elements,
  wheelSensitivity: 0.25,
  minZoom: 0.15,
  maxZoom: 4,
  style: [
    {
      selector: 'node',
      style: {
        'background-color': 'data(color)',
        'width': 'data(size)',
        'height': 'data(size)',
        'label': 'data(label)',
        'color': '#cfd0d8',
        'font-size': 11,
        'font-family': 'Inter, Segoe UI, system-ui, sans-serif',
        'text-valign': 'bottom',
        'text-halign': 'center',
        'text-margin-y': 4,
        'text-opacity': 'mapData(size, 8, 36, 0.0, 1.0)',
        'min-zoomed-font-size': 6,
        'border-width': 0,
        'overlay-opacity': 0,
        'transition-property': 'opacity, border-width, border-color, text-opacity',
        'transition-duration': 200,
      },
    },
    {
      selector: 'node.dim',
      style: { 'opacity': 0.12, 'text-opacity': 0 },
    },
    {
      selector: 'node.focus',
      style: { 'text-opacity': 1 },
    },
    {
      selector: 'node.highlighted',
      style: {
        'border-width': 2,
        'border-color': '#eaeaf2',
        'border-opacity': 1,
        'text-opacity': 1,
      },
    },
    {
      selector: 'edge',
      style: {
        'width': 0.7,
        'line-color': 'rgba(180,180,200,0.18)',
        'target-arrow-color': 'rgba(180,180,200,0.3)',
        'target-arrow-shape': 'triangle',
        'arrow-scale': 0.45,
        'curve-style': 'bezier',
        'transition-property': 'opacity, line-color, width, target-arrow-color',
        'transition-duration': 200,
      },
    },
    {
      selector: 'edge.dim',
      style: { 'opacity': 0.05 },
    },
    {
      selector: 'edge.focus',
      style: {
        'line-color': 'rgba(220,220,235,0.6)',
        'target-arrow-color': 'rgba(220,220,235,0.7)',
      },
    },
    {
      selector: 'edge.highlighted',
      style: {
        'width': 1.6,
        'line-color': '#eaeaf2',
        'target-arrow-color': '#eaeaf2',
      },
    },
  ],
  layout: {
    name: 'cose',
    animate: false,
    nodeRepulsion: () => 4500,
    idealEdgeLength: () => 110,
    edgeElasticity: () => 95,
    gravity: 0.25,
    numIter: 1200,
    initialTemp: 200,
    coolingFactor: 0.95,
    nodeOverlap: 12,
    fit: true,
    padding: 30,
  },
});

// Quick lookup
const nodesById = {};
DATA.nodes.forEach(n => { nodesById[n.id] = n; });

// ───── Obsidian-style hover focus: neighbors stay vivid, rest fades ─────
cy.on('mouseover', 'node', (e) => {
  const node = e.target;
  const hood = node.closedNeighborhood();
  cy.elements().not(hood).addClass('dim');
  hood.nodes().addClass('focus');
  hood.edges().addClass('focus');
});
cy.on('mouseout', 'node', () => {
  cy.elements().removeClass('dim focus');
});

// ───── highlight controller (driven by SSE markers) ─────
let currentHighlights = { nodes: new Set(), edges: new Set() };

function resetHighlights() {
  cy.elements().removeClass('highlighted');
  currentHighlights = { nodes: new Set(), edges: new Set() };
}

function focusOnImmediate(nodeIds) {
  if (!nodeIds.length) return;
  const sel = cy.collection(nodeIds.map(id => cy.$id(id)).filter(n => n.length));
  if (!sel.length) return;
  cy.stop();   // cancel any in-flight animation to prevent stacked jumps
  cy.animate({ fit: { eles: sel, padding: 80 }, duration: 700, easing: 'ease-in-out-quad' });
}

// Debounced focus: when the LLM rattles off several [[concept:X]] markers
// in quick succession we don't want the camera ping-ponging. Collect all
// terms that arrive within a 350ms window and fit them all in one shot.
let _focusBuffer = new Set();
let _focusTimer = null;
function focusOn(nodeIds) {
  nodeIds.forEach(t => _focusBuffer.add(t));
  if (_focusTimer) clearTimeout(_focusTimer);
  _focusTimer = setTimeout(() => {
    const ids = Array.from(_focusBuffer);
    _focusBuffer = new Set();
    _focusTimer = null;
    focusOnImmediate(ids);
  }, 350);
}

function highlightConcept(term) {
  const node = cy.$id(term);
  if (!node.length) return false;
  node.addClass('highlighted');
  currentHighlights.nodes.add(term);
  focusOn([term]);
  return true;
}

function highlightEdge(a, b) {
  const id = edgeIdByPair[`${a}|${b}`] || edgeIdByPair[`${b}|${a}`];
  if (id) {
    const edge = cy.$id(id);
    edge.addClass('highlighted');
    currentHighlights.edges.add(id);
  }
  const nodeA = cy.$id(a);
  const nodeB = cy.$id(b);
  if (nodeA.length) { nodeA.addClass('highlighted'); currentHighlights.nodes.add(a); }
  if (nodeB.length) { nodeB.addClass('highlighted'); currentHighlights.nodes.add(b); }
  focusOn([a, b].filter(t => cy.$id(t).length));
  return Boolean(id || nodeA.length || nodeB.length);
}

function applyHighlight(h) {
  if (h.kind === 'concept') {
    return highlightConcept(h.term);
  } else if (h.kind === 'edge') {
    return highlightEdge(h.a, h.b);
  }
  // note / judgment / word — visual marker in chat only for MVP-1
  return false;
}

// ───── chat ─────
const logEl = document.getElementById('log');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const history = [];   // [{role, content}]

function clearPlaceholder() {
  const p = logEl.querySelector('.placeholder');
  if (p) p.remove();
}

function newMsg(role) {
  clearPlaceholder();
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}

function renderTokenInto(el, text) {
  // Text is appended as plain text; we'll scan for markers AFTER the message is done.
  el.append(document.createTextNode(text));
  logEl.scrollTop = logEl.scrollHeight;
}

function decorateMarkersInPlace(el) {
  // Replace [[kind:body]] in the rendered text with clickable spans
  const re = /\[\[(concept|edge|note|judgment|word):([^\]]+)\]\]/g;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  const textNodes = [];
  while (walker.nextNode()) textNodes.push(walker.currentNode);
  textNodes.forEach(node => {
    const text = node.nodeValue;
    if (!re.test(text)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0;
    let m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const span = document.createElement('span');
      span.className = `mk mk-${m[1]}`;
      span.textContent = m[2];
      span.dataset.kind = m[1];
      span.dataset.body = m[2];
      span.title = `${m[1]}: ${m[2]}`;
      const kind = m[1];
      const body = m[2];
      span.addEventListener('click', () => {
        if (kind === 'concept') {
          highlightConcept(body);
        } else if (kind === 'edge') {
          const [a, b] = body.split(/->|→|=>/).map(s => s.trim());
          if (a && b) highlightEdge(a, b);
        } else if (kind === 'note') {
          // Open the source note in Obsidian. The body may be a full relative
          // path ("папка/файл.md") or contain ":chunk_idx" — strip the suffix.
          const fileOnly = body.split(':')[0];
          const url = `obsidian://open?vault=${encodeURIComponent(VAULT_NAME)}&file=${encodeURIComponent(fileOnly)}`;
          window.location.href = url;
        } else if (kind === 'judgment') {
          // "term#N" — focus the term, opening sources panel as bonus.
          const term = body.split('#')[0];
          if (term) showSourcesFor(term);
        } else if (kind === 'word') {
          // Literal word — no graph action yet; click is a no-op stub.
        }
      });
      // dbltap on concept span → drill-down to sources panel
      if (kind === 'concept') {
        span.addEventListener('dblclick', (e) => { e.stopPropagation(); showSourcesFor(body); });
        span.title = `${kind}: ${body} (двойной клик — откуда пришёл)`;
      } else if (kind === 'note') {
        span.title = `note: ${body} (клик — открыть в Obsidian)`;
      }
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
}

async function ask(question) {
  if (!question.trim()) return;
  sendBtn.disabled = true;
  history.push({ role: 'user', content: question });
  newMsg('user').textContent = question;

  const botEl = newMsg('bot');
  resetHighlights();

  let resp;
  try {
    resp = await fetch('/viz/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
  } catch (e) {
    botEl.className = 'msg error';
    botEl.textContent = `Сеть: ${e.message}`;
    sendBtn.disabled = false;
    return;
  }
  if (!resp.ok || !resp.body) {
    botEl.className = 'msg error';
    botEl.textContent = `HTTP ${resp.status}: ${await resp.text()}`;
    sendBtn.disabled = false;
    return;
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let assistantText = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });

    // Parse SSE events: blocks separated by \n\n
    let idx;
    while ((idx = buf.indexOf('\n\n')) !== -1) {
      const block = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      let eventType = 'message';
      let dataLine = '';
      block.split('\n').forEach(line => {
        if (line.startsWith('event: ')) eventType = line.slice(7).trim();
        else if (line.startsWith('data: ')) dataLine += line.slice(6);
      });
      if (!dataLine) continue;
      let data;
      try { data = JSON.parse(dataLine); } catch { continue; }

      if (eventType === 'token') {
        renderTokenInto(botEl, data.text);
        assistantText += data.text;
      } else if (eventType === 'highlight') {
        applyHighlight(data);
      } else if (eventType === 'error') {
        const e = document.createElement('div');
        e.className = 'msg error';
        e.textContent = `[ошибка] ${data.message}`;
        logEl.appendChild(e);
      } else if (eventType === 'done') {
        decorateMarkersInPlace(botEl);
      }
    }
  }

  history.push({ role: 'assistant', content: assistantText });
  sendBtn.disabled = false;
  inputEl.focus();
}

sendBtn.addEventListener('click', () => {
  const q = inputEl.value;
  inputEl.value = '';
  ask(q);
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendBtn.click();
  }
});

// Single click on node: focus.
cy.on('tap', 'node', (e) => {
  const id = e.target.id();
  focusOn([id]);
});

// Double click on node: drill-down to source notes (provenance).
cy.on('dbltap', 'node', async (e) => {
  const term = e.target.id();
  await showSourcesFor(term);
});

// ───── Sources drill-down panel ─────
async function showSourcesFor(term) {
  let panel = document.getElementById('sources-panel');
  if (!panel) {
    panel = document.createElement('div');
    panel.id = 'sources-panel';
    document.getElementById('chat').insertBefore(panel, document.getElementById('log'));
  }
  panel.innerHTML = '<div class="sources-loading">Загружаю источники…</div>';

  try {
    const r = await fetch(`/viz/concepts/${encodeURIComponent(term)}/sources?top_k=15`);
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      panel.innerHTML = `<div class="sources-err">Источники не найдены для «${escapeHTML(term)}». ${escapeHTML(err.detail || '')}</div>`;
      return;
    }
    const data = await r.json();
    if (!data.sources || data.sources.length === 0) {
      panel.innerHTML = `<div class="sources-err">У «${escapeHTML(term)}» нет атрибуции к заметкам (карта собрана до provenance-патча — пересобери vault_sync).</div>`;
      return;
    }
    const vault = data.vault_name || '';
    const silentBadge = data.silent
      ? `<span class="src-silent-badge" title="Упомянуто всего ${data.freq} раз — слабый сигнал, в карту не попадает">🔇 silent · ${data.freq}×</span>`
      : '';
    const items = data.sources.map(s => {
      const fileOnly = s.path.split(':')[0];       // strip ":chunk_idx" if present
      const obsidianLink = `obsidian://open?vault=${encodeURIComponent(vault)}&file=${encodeURIComponent(fileOnly)}`;
      const pct = Math.round(s.weight * 100);
      const bar = `<span class="src-bar" style="width:${pct}%"></span>`;
      return `<a class="src-row" href="${obsidianLink}">
        <span class="src-rank">${bar}</span>
        <span class="src-path">${escapeHTML(fileOnly)}</span>
        <span class="src-weight">${pct}%</span>
      </a>`;
    }).join('');
    panel.innerHTML = `
      <div class="sources-head">
        <span class="sources-title">«${escapeHTML(term)}» — откуда пришёл смысл${silentBadge}</span>
        <button class="sources-close" title="Закрыть">×</button>
      </div>
      <div class="sources-list">${items}</div>`;
    panel.querySelector('.sources-close').onclick = () => panel.remove();
  } catch (err) {
    panel.innerHTML = `<div class="sources-err">Ошибка: ${escapeHTML(String(err))}</div>`;
  }
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

inputEl.focus();
</script>
</body>
</html>
